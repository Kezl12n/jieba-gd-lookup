[build-system]
requires = ["uv-build", "setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "jieba-gd-lookup"
version = "0.1.0"
description = "Produce clickable words and parse any sent for GoldenDict(-ng) with Jieba."
dependencies = [
  "jieba"  
]

[project.scripts]
jieba-gd-lookup = "jieba_gd_lookup.__main__:run"


[tool.uv.extra-build-dependencies]
jieba = ["setuptools"]


[tool.hatch.build.targets.wheel]
packages = ["src/jieba_gd_lookup"]

[tool.hatch.build.targets.wheel.force-include]
"src/jieba_gd_lookup/dict" = "jieba_gd_lookup/dict"
